  <body class="account-loading kx-page kx-secondary" data-dashboard="owner">
    <a class="dash-skip" href="#dashboardMain">Skip to dashboard</a>
    <div class="dash-layout">
      <aside class="dash-sidebar">
        <a class="dash-brand" href="../../index.html">
          <img src="../../assets/logo/kicks-logo.png" alt="" />
          <span>KICKS</span>
        </a>
        <p class="side-label" id="roleLabel"></p>
        <nav id="dashNav" aria-label="Dashboard navigation"></nav>
        <a class="sidebar-profile" id="sidebarProfile" href="#profile" aria-label="My account"></a>
<div class="side-bottom">
          <span class="side-dot"> </span>
          <strong>Your workspace</strong>
          <p>Manage your account and football activity.</p>
          <a href="../Teams/teams.html">Teams ↗</a><a href="../Challenges/challenges.html">Challenge Me ↗</a><a href="../../index.html">← Back to website</a><button class="sidebar-logout" type="button" data-logout>Log out ↗</button>
        </div>
      </aside>
      <main id="dashboardMain" class="dash-main">
        <header class="dash-top">
          <div>
            <p class="dash-eyebrow">YOUR GAME. YOUR SPACE.</p>
            <h1 id="viewTitle">Overview</h1>
          </div>
          <a class="avatar-link" href="#profile">
            <span id="avatarLetters"> </span>
            <div>
              <strong id="accountName"> </strong>
              <small id="accountRole"> </small>
            </div>
          </a>
        </header>

        <div id="storageWarning" class="storage-warning" hidden>
          Browser storage is unavailable. Changes last only while this page
          stays open.
        </div>
        <div id="dashboardView"></div>
        <noscript>
          <p>Enable JavaScript to explore the dashboard.</p>
        </noscript>
      </main>
    </div>
    <div
      id="dashToast"
      class="dash-toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <dialog id="editorDialog" aria-labelledby="editorTitle">
      <header class="dialog-header">
        <div>
          <p class="dash-eyebrow">YOUR WORKSPACE</p>
          <h2 id="editorTitle"></h2>
        </div>
        <button
          type="button"
          data-close="editorDialog"
          aria-label="Close editor"
        >
          ×
        </button>
      </header>
      <form id="editorForm">
        <div id="editorFields" class="editor-fields"></div>
        <p id="editorError" class="editor-error" role="alert"></p>
        <div class="editor-actions">
          <button
            type="button"
            class="dash-btn secondary"
            data-close="editorDialog"
          >
            Cancel
          </button>
          <button class="dash-btn">Save changes ↗</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirmDialog" aria-labelledby="confirmTitle">
      <h2 id="confirmTitle">Remove this record?</h2>
      <p id="confirmText"></p>
      <p id="confirmError" class="editor-error" role="alert"></p>
      <div class="editor-actions">
        <button class="dash-btn secondary" data-close="confirmDialog">
          Keep record
        </button>
        <button class="dash-btn danger" id="confirmAction">Remove</button>
      </div>
    </dialog>
  <script src="../../js/site-polish.js?v=cleanup-1" defer></script>
